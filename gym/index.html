<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Jarvis Gym</title>
<style>
:root{--void:#03070d;--panel:#07131f;--line:#15405a;--cyan:#52dcff;--cyan-dim:#2a8fb3;--ice:#d9f6ff;--mute:#7fa6ba;--gold:#f2b544;--red:#e5402f;--green:#4ef0a4;--glow:0 0 .7rem rgba(82,220,255,.45);--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--void)}
body{margin:0;min-height:100dvh;color:var(--ice);font:17px/1.4 "Rajdhani","Segoe UI",system-ui,sans-serif;background-color:var(--void);background-image:linear-gradient(rgba(82,220,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(82,220,255,.04) 1px,transparent 1px);background-size:32px 32px;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{max-width:560px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.05rem;letter-spacing:.22em;color:var(--cyan);text-shadow:var(--glow);font-weight:700}
#live{font-family:var(--mono);font-size:.8rem;color:var(--green);letter-spacing:.1em}
#live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green)}
main{max-width:560px;margin:0 auto;padding:12px 16px}
h2{margin:18px 0 10px;font-size:.9rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:700}
h2:first-child{margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.mute{color:var(--mute)}
.mono{font-family:var(--mono)}
.big{font-size:1.9rem;font-weight:700;color:var(--cyan);line-height:1.1}
.hero{display:flex;gap:16px;align-items:center}
.hero svg{flex:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{min-height:48px;padding:0 16px;border-radius:8px;border:1px solid var(--cyan-dim);background:rgba(82,220,255,.08);color:var(--cyan);font:inherit;font-weight:700;letter-spacing:.06em;text-transform:uppercase;width:100%;margin:0 0 10px;cursor:pointer}
.btn:active{background:rgba(82,220,255,.22)}
.btn.primary{background:var(--cyan);color:var(--void);border-color:var(--cyan)}
.btn.danger{border-color:var(--red);color:var(--red);background:rgba(229,64,47,.08)}
.btn.small{min-height:40px;padding:0 12px;font-size:.85rem;margin:0}
.btn.mic.on{background:var(--red);border-color:var(--red);color:#fff}
.plan-btn{display:flex;justify-content:space-between;align-items:center;text-align:left}
.plan-btn small{color:var(--mute);font-weight:500;letter-spacing:0;text-transform:none;font-size:.9rem}
input,select,textarea{width:100%;min-height:48px;background:#02060b;border:1px solid var(--line);border-radius:8px;color:var(--ice);font:inherit;font-size:18px;padding:8px 10px;margin:0 0 8px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
label{display:block;font-size:.85rem;color:var(--mute);margin:6px 0 2px;letter-spacing:.05em}
.check{display:flex;align-items:center;gap:10px;margin:8px 0}
.check input{width:24px;min-height:24px;margin:0}
.ex h3{margin:0;font-size:1.15rem;color:var(--ice)}
.ex .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hint{font-size:.9rem;color:var(--mute);margin:2px 0}
.hint b{color:var(--gold);font-weight:600}
.sets{list-style:none;margin:8px 0;padding:0}
.sets li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(21,64,90,.6);font-family:var(--mono)}
.badge{font-size:.7rem;background:var(--gold);color:#000;border-radius:4px;padding:1px 6px;margin-left:8px;font-family:inherit;font-weight:700}
.step{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:start}
.step .btn{margin:0;padding:0;font-size:1.3rem}
.step input{text-align:center;margin:0}
.fields{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0}
.fields.two{grid-template-columns:1fr 1fr;gap:10px}
#restBox{display:flex;align-items:center;gap:8px;background:rgba(242,181,68,.1);border:1px solid var(--gold);border-radius:8px;padding:6px 10px;margin:0 0 12px}
#restBox.done{border-color:var(--green);background:rgba(78,240,164,.1)}
#restBox .t{font-family:var(--mono);font-size:1.5rem;color:var(--gold);flex:1}
#restBox.done .t{color:var(--green)}
.heard{font-size:.9rem;color:var(--mute);min-height:1.3em;margin:-4px 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stats .card{margin:0;text-align:center}
.stats .big{font-size:1.5rem}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:9px;font-family:var(--mono)}
.empty{color:var(--mute);text-align:center;padding:20px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(3,7,13,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{min-height:60px;background:none;border:0;color:var(--mute);font:inherit;font-weight:700;letter-spacing:0;text-transform:uppercase;font-size:.68rem;padding:0 2px;border-top:2px solid transparent}
nav button[aria-current=page]{color:var(--cyan);border-top-color:var(--cyan);text-shadow:var(--glow)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--panel);border:1px solid var(--cyan);color:var(--ice);padding:12px 14px;border-radius:8px;box-shadow:var(--glow);text-align:center;z-index:10}
@media (prefers-reduced-motion:no-preference){#toast{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<header><h1>JARVIS // GYM</h1><span id="live" hidden>LIVE</span></header>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<nav aria-label="Navigation">
  <button data-tab="heute">Heute</button>
  <button data-tab="plaene">Pläne</button>
  <button data-tab="verlauf">Verlauf</button>
  <button data-tab="fortschritt">Fortschritt</button>
</nav>
<script>
'use strict';
const LS = 'jarvisGym.v1';
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (v, d = 0) => Number.isFinite(+v) ? +v : d;
const str = (v, d = '') => typeof v === 'string' ? v.slice(0, 80) : d;
const norm = s => s.trim().toLowerCase();

const DEFAULT = {
  plans: [
    { id: 'p1', name: 'Push', exercises: ['Bankdrücken', 'Schulterdrücken', 'Schrägbankdrücken', 'Seitheben', 'Trizepsdrücken'] },
    { id: 'p2', name: 'Pull', exercises: ['Klimmzüge', 'Rudern', 'Latziehen', 'Face Pulls', 'Bizeps-Curls'] },
    { id: 'p3', name: 'Beine', exercises: ['Kniebeugen', 'Beinpresse', 'Rumänisches Kreuzheben', 'Beinbeuger', 'Wadenheben'] }
  ],
  workouts: [],
  active: null,
  settings: { rest: 90, goal: 3, repTarget: 8, step: 2.5, speak: false }
};

function cleanSets(a) {
  return (Array.isArray(a) ? a : []).map(s => ({
    ex: str(s && s.ex), kg: Math.max(0, num(s && s.kg)), reps: Math.round(num(s && s.reps)),
    t: num(s && s.t), pr: s && s.pr ? true : undefined
  })).filter(s => s.ex && s.reps >= 1);
}
function cleanNames(a) { return (Array.isArray(a) ? a : []).map(x => str(x).trim()).filter(Boolean); }

function sanitize(o) {
  o = o && typeof o === 'object' ? o : {};
  const st = clone(DEFAULT);
  if (Array.isArray(o.plans)) {
    st.plans = o.plans.map(p => ({ id: str(p && p.id) || uid(), name: str(p && p.name, 'Plan'), exercises: cleanNames(p && p.exercises) }));
  }
  st.workouts = (Array.isArray(o.workouts) ? o.workouts : []).map(w => ({
    id: str(w && w.id) || uid(), start: num(w && w.start), end: num(w && w.end),
    plan: str(w && w.plan, 'Training'), sets: cleanSets(w && w.sets)
  })).filter(w => w.sets.length && w.start);
  const a = o.active;
  if (a && typeof a === 'object' && num(a.start)) {
    st.active = {
      id: str(a.id) || uid(), start: num(a.start), plan: str(a.plan, 'Training'),
      exercises: cleanNames(a.exercises), sets: cleanSets(a.sets), draft: {}, restEnd: num(a.restEnd) || null
    };
  }
  const s = o.settings || {};
  st.settings = {
    rest: clamp(num(s.rest, 90), 10, 600), goal: clamp(Math.round(num(s.goal, 3)), 1, 14),
    repTarget: clamp(Math.round(num(s.repTarget, 8)), 1, 30), step: clamp(num(s.step, 2.5), 0.25, 25), speak: !!s.speak
  };
  return st;
}

let S;
try { S = sanitize(JSON.parse(localStorage.getItem(LS))); } catch { S = sanitize(null); }
function save() {
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch { toast('Speichern fehlgeschlagen – Speicher voll oder gesperrt'); }
}

/* ---------- DOM helpers ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in props || {}) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  for (const c of kids) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800);
}

/* ---------- formatting & stats ---------- */
const fmtKg = n => String(Math.round(n * 100) / 100).replace('.', ',');
const parseNum = v => parseFloat(String(v).replace(',', '.'));
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return hh ? `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${mm}:${String(ss).padStart(2, '0')}`;
}
const fmtDate = ts => new Date(ts).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
const fmtShort = ts => new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
const e1rm = (kg, reps) => kg * (1 + reps / 30);
const volume = sets => sets.reduce((a, s) => a + s.kg * s.reps, 0);

function weekStart(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return d.getTime();
}
function weekCount() {
  const w = weekStart(Date.now());
  return S.workouts.filter(x => weekStart(x.start) === w).length;
}
function streak() {
  const counts = new Map();
  S.workouts.forEach(w => { const k = weekStart(w.start); counts.set(k, (counts.get(k) || 0) + 1); });
  const d = new Date(weekStart(Date.now()));
  let n = 0;
  if ((counts.get(d.getTime()) || 0) < S.settings.goal) d.setDate(d.getDate() - 7);
  while ((counts.get(d.getTime()) || 0) >= S.settings.goal) { n++; d.setDate(d.getDate() - 7); }
  return n;
}
function allSets(ex) {
  const k = norm(ex);
  const saved = S.workouts.flatMap(w => w.sets);
  const cur = S.active ? S.active.sets : [];
  return saved.concat(cur).filter(s => norm(s.ex) === k);
}
function lastSets(ex) {
  const k = norm(ex);
  for (const w of S.workouts) {
    const m = w.sets.filter(s => norm(s.ex) === k);
    if (m.length) return m;
  }
  return [];
}
function suggest(ex) {
  const l = lastSets(ex);
  if (!l.length) return null;
  const top = Math.max(...l.map(s => s.kg));
  const atTop = l.filter(s => s.kg === top);
  const { repTarget, step } = S.settings;
  const best = Math.max(...atTop.map(s => s.reps));
  if (top > 0 && atTop.every(s => s.reps >= repTarget)) return { kg: Math.round((top + step) * 100) / 100, reps: repTarget };
  return { kg: top, reps: best + 1 };
}

/* ---------- audio, vibration, wake lock, speech ---------- */
let ac = null;
function unlockAudio() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch {}
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
function beep() {
  try {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 880; g.gain.value = 0.2;
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.25);
  } catch {}
}
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
function say(text) {
  try {
    if (!S.settings.speak || !window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE';
    speechSynthesis.speak(u);
  } catch {}
}
let wl = null;
async function wake() {
  try {
    if ('wakeLock' in navigator && S.active && !wl) {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    }
  } catch {}
}
function releaseWake() { try { wl && wl.release(); } catch {} wl = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); tick(); } });

/* ---------- workout logic ---------- */
let tab = 'heute', focusEx = 0, chartEx = null, chartMetric = 'kg', lastHeard = '';

function startWorkout(plan, exercises) {
  S.active = { id: uid(), start: Date.now(), plan, exercises: [...exercises], sets: [], draft: {}, restEnd: null };
  save(); startTicker(); wake(); render();
}
function addSet(ex, kg, reps, viaVoice) {
  const a = S.active;
  if (!a) return;
  if (!(kg >= 0) || !(reps >= 1) || reps > 100 || kg > 1000) return toast('Bitte Gewicht und Wiederholungen prüfen');
  reps = Math.round(reps);
  const prev = Math.max(0, ...allSets(ex).map(s => s.kg));
  const pr = prev > 0 && kg > prev;
  a.sets.push({ ex, kg, reps, t: Date.now(), pr: pr || undefined });
  a.restEnd = Date.now() + S.settings.rest * 1000;
  save(); render(); vibrate(30);
  toast(pr ? `Neuer Rekord: ${fmtKg(kg)} kg!` : `${ex}: ${fmtKg(kg)} kg × ${reps} gespeichert`);
  if (viaVoice) say(pr ? 'Neuer Rekord!' : 'Gespeichert');
}
function removeSet(set) {
  S.active.sets = S.active.sets.filter(s => s !== set);
  save(); render();
}
function finishWorkout() {
  const a = S.active;
  if (!a.sets.length) {
    if (!confirm('Keine Sätze erfasst. Training verwerfen?')) return;
    S.active = null; save(); stopTicker(); releaseWake(); render(); return;
  }
  if (!confirm('Training beenden und speichern?')) return;
  S.workouts.unshift({ id: a.id, start: a.start, end: Date.now(), plan: a.plan, sets: a.sets });
  S.active = null; save(); stopTicker(); releaseWake(); tab = 'heute'; render();
  toast(`Gespeichert: ${a.sets.length} ${a.sets.length === 1 ? 'Satz' : 'Sätze'}, ${Math.round(volume(a.sets))} kg Volumen`);
}

/* ---------- timers ---------- */
let tickId = null, beeped = 0;
function startTicker() { if (!tickId) { tick(); tickId = setInterval(tick, 500); } }
function stopTicker() { clearInterval(tickId); tickId = null; }
function tick() {
  const a = S.active;
  if (!a) { stopTicker(); return; }
  const now = Date.now();
  const el = document.getElementById('elapsed');
  if (el) el.textContent = fmtDur(now - a.start);
  const box = document.getElementById('restBox');
  if (box) {
    const left = a.restEnd ? a.restEnd - now : 0;
    box.hidden = !(a.restEnd && (left > 0 || now - a.restEnd < 4000));
    box.classList.toggle('done', left <= 0);
    const t = document.getElementById('restTime');
    if (t) t.textContent = left > 0 ? fmtDur(Math.ceil(left / 1000) * 1000) : 'GO!';
  }
  if (a.restEnd && now >= a.restEnd && now - a.restEnd < 3000 && beeped !== a.restEnd) {
    beeped = a.restEnd; beep(); vibrate([200, 100, 200]);
  }
}

/* ---------- voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen() {
  if (!SR) return toast('Spracheingabe nicht unterstützt – nutze das Mikrofon deiner Tastatur');
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'de-DE'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => { lastHeard = e.results[0][0].transcript; handleVoice(lastHeard); };
  rec.onerror = e => toast('Sprache: ' + (e.error || 'Fehler'));
  rec.onend = () => {
    rec = null;
    const m = document.getElementById('mic');
    if (m) { m.classList.remove('on'); m.setAttribute('aria-pressed', 'false'); }
  };
  const m = document.getElementById('mic');
  if (m) { m.classList.add('on'); m.setAttribute('aria-pressed', 'true'); }
  try { rec.start(); } catch { rec = null; }
}
function handleVoice(text) {
  const a = S.active;
  if (!a) return;
  const t = text.toLowerCase().replace(/(\d)\s*komma\s*(\d)/g, '$1.$2').replace(/(\d),(\d)/g, '$1.$2');
  const nums = t.match(/\d+(?:\.\d+)?/g) || [];
  if (nums.length < 2) return toast(`Nicht verstanden: „${text}“`);
  const kg = parseFloat(nums[0]), reps = parseInt(nums[1], 10);
  const ex = a.exercises.find(n => t.includes(n.toLowerCase()))
    || a.exercises.find(n => n.toLowerCase().split(/\s+/).some(w => w.length > 3 && t.includes(w)))
    || a.exercises[focusEx];
  if (!ex) return toast('Welche Übung? Sag z. B. „Bankdrücken 80 mal 8“');
  addSet(ex, kg, reps, true);
}

/* ---------- charts ---------- */
function lineChart(points, unit) {
  const W = 320, H = 170, L = 38, R = 10, T = 12, B = 24;
  const svg = sv('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Verlauf: ${points.map(p => p.label + ' ' + fmtKg(p.value) + ' ' + unit).join(', ')}` });
  let lo = Math.min(...points.map(p => p.value)), hi = Math.max(...points.map(p => p.value));
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = i => points.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (points.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, yy = y(v);
    svg.append(sv('line', { x1: L, x2: W - R, y1: yy, y2: yy, stroke: '#15405a', 'stroke-width': 0.5 }));
    svg.append(sv('text', { x: L - 4, y: yy + 3, 'text-anchor': 'end' }, fmtKg(Math.round(v * 10) / 10)));
  }
  svg.append(sv('polyline', { points: points.map((p, i) => `${x(i)},${y(p.value)}`).join(' '), fill: 'none', stroke: '#52dcff', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
  points.forEach((p, i) => svg.append(sv('circle', { cx: x(i), cy: y(p.value), r: 3, fill: '#03070d', stroke: '#52dcff', 'stroke-width': 2 })));
  svg.append(sv('text', { x: x(0), y: H - 6, 'text-anchor': points.length === 1 ? 'middle' : 'start' }, points[0].label));
  if (points.length > 1) svg.append(sv('text', { x: x(points.length - 1), y: H - 6, 'text-anchor': 'end' }, points[points.length - 1].label));
  return svg;
}
function barChart(bars) {
  const W = 320, H = 150, L = 8, R = 8, T = 16, B = 22;
  const svg = sv('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Wochenvolumen: ' + bars.map(b => `${b.label} ${Math.round(b.value)} kg`).join(', ') });
  const max = Math.max(1, ...bars.map(b => b.value)), bw = (W - L - R) / bars.length;
  bars.forEach((b, i) => {
    const bh = (H - T - B) * b.value / max, xx = L + i * bw + bw * 0.15;
    svg.append(sv('rect', { x: xx, y: H - B - bh, width: bw * 0.7, height: Math.max(bh, b.value ? 1 : 0), fill: i === bars.length - 1 ? '#52dcff' : '#2a8fb3', rx: 2 }));
    if (b.value) svg.append(sv('text', { x: xx + bw * 0.35, y: H - B - bh - 3, 'text-anchor': 'middle' }, fmtKg(Math.round(b.value / 100) / 10) + 't'));
    svg.append(sv('text', { x: xx + bw * 0.35, y: H - 8, 'text-anchor': 'middle' }, b.label));
  });
  return svg;
}
function ring(n, goal) {
  const r = 34, c = 2 * Math.PI * r, p = Math.min(1, n / goal);
  return sv('svg', { width: 88, height: 88, viewBox: '0 0 88 88', role: 'img', 'aria-label': `${n} von ${goal} Trainings diese Woche` },
    sv('circle', { cx: 44, cy: 44, r, fill: 'none', stroke: '#15405a', 'stroke-width': 8 }),
    sv('circle', { cx: 44, cy: 44, r, fill: 'none', stroke: p >= 1 ? '#4ef0a4' : '#52dcff', 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-dasharray': `${c * p} ${c}`, transform: 'rotate(-90 44 44)' }),
    sv('circle', { cx: 44, cy: 44, r: 18, fill: 'none', stroke: '#2a8fb3', 'stroke-width': 1, 'stroke-dasharray': '3 4' }));
}

/* ---------- views ---------- */
function viewHeute() {
  if (S.active) return viewActive();
  const wk = weekCount(), goal = S.settings.goal;
  return [
    h('section', { class: 'card hero' }, ring(wk, goal),
      h('div', {}, h('div', { class: 'big' }, `${wk}/${goal}`), h('div', { class: 'mute' }, 'Trainings diese Woche'), h('div', { class: 'mute' }, `Serie: ${streak()} ${streak() === 1 ? 'Woche' : 'Wochen'}`))),
    h('h2', {}, 'Training starten'),
    ...S.plans.map(p => h('button', { class: 'btn plan-btn', onclick: () => startWorkout(p.name, p.exercises) }, h('span', {}, p.name), h('small', {}, `${p.exercises.length} Übungen`))),
    h('button', { class: 'btn', onclick: () => startWorkout('Freies Training', []) }, 'Freies Training')
  ];
}

function viewActive() {
  const a = S.active, out = [];
  out.push(h('section', { class: 'card bar' },
    h('div', {}, h('div', { class: 'mute' }, a.plan), h('div', { class: 'big mono', id: 'elapsed' }, fmtDur(Date.now() - a.start))),
    h('button', { class: 'btn primary small', style: 'width:auto', onclick: finishWorkout }, 'Beenden')));
  out.push(h('div', { id: 'restBox', hidden: true },
    h('span', { class: 'mute' }, 'Pause'), h('span', { class: 't', id: 'restTime' }, ''),
    h('button', { class: 'btn small', style: 'width:auto', onclick: () => { a.restEnd = Math.max(a.restEnd || 0, Date.now()) + 30000; save(); tick(); } }, '+30s'),
    h('button', { class: 'btn small', style: 'width:auto', onclick: () => { a.restEnd = null; save(); tick(); } }, 'Weiter')));
  out.push(h('button', { class: 'btn mic', id: 'mic', 'aria-pressed': 'false', onclick: listen }, 'Sprechen'));
  out.push(h('div', { class: 'heard' }, lastHeard ? `Gehört: „${lastHeard}“` : 'Sag z. B. „Bankdrücken 80 mal 8“'));
  a.exercises.forEach((name, i) => out.push(exCard(name, i)));
  const nameIn = h('input', { type: 'text', placeholder: 'Übung hinzufügen …', maxlength: '40', 'aria-label': 'Neue Übung' });
  const add = () => {
    const n = nameIn.value.trim();
    if (!n) return;
    if (!a.exercises.some(x => norm(x) === norm(n))) a.exercises.push(n);
    save(); render();
  };
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  out.push(h('section', { class: 'card' }, nameIn, h('button', { class: 'btn small', style: 'width:100%', onclick: add }, '+ Übung')));
  return out;
}

function exCard(name, i) {
  const a = S.active, last = lastSets(name), sug = suggest(name);
  const d = a.draft[name] || (a.draft[name] = { kg: sug ? String(sug.kg) : '', reps: sug ? String(sug.reps) : '' });
  const mine = a.sets.filter(s => s.ex === name);
  const best = Math.max(0, ...allSets(name).map(s => s.kg));
  const kg = h('input', { type: 'number', inputmode: 'decimal', step: 'any', min: '0', value: d.kg, 'aria-label': 'Gewicht in Kilogramm', oninput: e => { d.kg = e.target.value; focusEx = i; } });
  const reps = h('input', { type: 'number', inputmode: 'numeric', step: '1', min: '1', value: d.reps, 'aria-label': 'Wiederholungen', oninput: e => { d.reps = e.target.value; focusEx = i; } });
  const nudge = (inp, key, delta, min) => () => {
    inp.value = Math.max(min, Math.round(((parseNum(inp.value) || 0) + delta) * 100) / 100);
    d[key] = inp.value; focusEx = i;
  };
  const stepKg = S.settings.step;
  return h('section', { class: 'card ex' },
    h('div', { class: 'head' }, h('h3', {}, name),
      !mine.length && h('button', { class: 'btn small', style: 'width:auto', 'aria-label': `${name} entfernen`, onclick: () => { a.exercises.splice(i, 1); save(); render(); } }, '×')),
    last.length ? h('div', { class: 'hint' }, 'Letztes Mal: ', last.map(s => `${fmtKg(s.kg)}×${s.reps}`).join(' · ')) : h('div', { class: 'hint' }, 'Noch keine Daten'),
    sug && h('div', { class: 'hint' }, 'Vorschlag: ', h('b', {}, `${fmtKg(sug.kg)} kg × ${sug.reps}`)),
    best > 0 && h('div', { class: 'hint' }, `Rekord: ${fmtKg(best)} kg`),
    mine.length ? h('ul', { class: 'sets' }, mine.map((s, n) => h('li', {},
      h('span', {}, `Satz ${n + 1}: ${fmtKg(s.kg)} kg × ${s.reps}`, s.pr && h('span', { class: 'badge' }, 'PR')),
      h('button', { class: 'btn small', style: 'width:auto', 'aria-label': `Satz ${n + 1} löschen`, onclick: () => removeSet(s) }, '×')))) : null,
    h('div', { class: 'fields' },
      h('div', {}, h('label', {}, 'Gewicht (kg)'), h('div', { class: 'step' }, h('button', { class: 'btn', 'aria-label': 'weniger Gewicht', onclick: nudge(kg, 'kg', -stepKg, 0) }, '−'), kg, h('button', { class: 'btn', 'aria-label': 'mehr Gewicht', onclick: nudge(kg, 'kg', stepKg, 0) }, '+'))),
      h('div', {}, h('label', {}, 'Wiederholungen'), h('div', { class: 'step' }, h('button', { class: 'btn', 'aria-label': 'weniger Wiederholungen', onclick: nudge(reps, 'reps', -1, 1) }, '−'), reps, h('button', { class: 'btn', 'aria-label': 'mehr Wiederholungen', onclick: nudge(reps, 'reps', 1, 1) }, '+')))),
    h('button', { class: 'btn primary', onclick: () => { focusEx = i; addSet(name, parseNum(kg.value), parseNum(reps.value)); } }, 'Satz speichern'));
}

function viewPlaene() {
  const out = [h('h2', {}, 'Trainingspläne')];
  S.plans.forEach(p => {
    const name = h('input', { type: 'text', value: p.name, maxlength: '40', 'aria-label': 'Planname' });
    const ta = h('textarea', { rows: '6', 'aria-label': 'Übungen, eine pro Zeile' }, p.exercises.join('\n'));
    out.push(h('section', { class: 'card' }, name, ta, h('div', { class: 'row' },
      h('button', { class: 'btn primary small', onclick: () => { p.name = name.value.trim() || 'Plan'; p.exercises = cleanNames(ta.value.split('\n')); save(); toast('Plan gespeichert'); render(); } }, 'Speichern'),
      h('button', { class: 'btn danger small', onclick: () => { if (confirm(`Plan „${p.name}“ löschen?`)) { S.plans = S.plans.filter(x => x !== p); save(); render(); } } }, 'Löschen'))));
  });
  out.push(h('button', { class: 'btn', onclick: () => { S.plans.push({ id: uid(), name: 'Neuer Plan', exercises: [] }); save(); render(); } }, '+ Neuer Plan'));
  out.push(h('h2', {}, 'Einstellungen'), settingsCard());
  return out;
}

function settingsCard() {
  const s = S.settings;
  const field = (label, key, min, max, step) => {
    const inp = h('input', { type: 'number', inputmode: 'decimal', min, max, step, value: s[key], 'aria-label': label,
      onchange: e => { const v = parseNum(e.target.value); if (Number.isFinite(v)) { s[key] = clamp(v, +min, +max); save(); } e.target.value = s[key]; } });
    return h('div', {}, h('label', {}, label), inp);
  };
  const speak = h('input', { type: 'checkbox', id: 'speak', onchange: e => { s.speak = e.target.checked; save(); } });
  speak.checked = s.speak;
  const file = h('input', { type: 'file', accept: 'application/json,.json', hidden: true, onchange: async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const next = sanitize(JSON.parse(await f.text()));
      if (!confirm(`Backup einspielen? Es enthält ${next.workouts.length} Trainings und ersetzt deine aktuellen Daten.`)) return;
      S = next; save(); stopTicker(); if (S.active) startTicker(); render(); toast('Backup eingespielt');
    } catch { toast('Datei konnte nicht gelesen werden'); }
    e.target.value = '';
  } });
  return h('section', { class: 'card' },
    h('div', { class: 'fields two' }, field('Pause (Sekunden)', 'rest', '10', '600', '5'), field('Ziel pro Woche', 'goal', '1', '14', '1')),
    h('div', { class: 'fields two' }, field('Ziel-Wiederholungen', 'repTarget', '1', '30', '1'), field('Gewichtsschritt (kg)', 'step', '0.25', '25', '0.25')),
    h('div', { class: 'check' }, speak, h('label', { for: 'speak', style: 'margin:0;font-size:1rem;color:var(--ice)' }, 'Sprachausgabe bei Spracheingabe')),
    h('h2', {}, 'Backup'),
    h('p', { class: 'hint' }, 'Deine Daten liegen nur auf diesem Gerät. Exportiere sie regelmäßig.'),
    h('div', { class: 'row' },
      h('button', { class: 'btn small', onclick: exportData }, 'Exportieren'),
      h('button', { class: 'btn small', onclick: () => file.click() }, 'Importieren')),
    file);
}
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `jarvis-gym-backup-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function viewVerlauf() {
  if (!S.workouts.length) return [h('h2', {}, 'Verlauf'), h('p', { class: 'empty' }, 'Noch keine Trainings gespeichert.')];
  return [h('h2', {}, 'Verlauf'), ...S.workouts.map(w => {
    const groups = new Map();
    w.sets.forEach(s => { if (!groups.has(s.ex)) groups.set(s.ex, []); groups.get(s.ex).push(s); });
    return h('section', { class: 'card' },
      h('div', { class: 'bar' },
        h('div', {}, h('b', {}, `${fmtDate(w.start)} · ${w.plan}`), w.sets.some(s => s.pr) && h('span', { class: 'badge' }, 'PR')),
        h('button', { class: 'btn small', style: 'width:auto', 'aria-label': 'Training löschen', onclick: () => { if (confirm('Dieses Training löschen?')) { S.workouts = S.workouts.filter(x => x !== w); save(); render(); } } }, '×')),
      h('div', { class: 'hint' }, `${w.end > w.start ? fmtDur(w.end - w.start) + ' · ' : ''}${w.sets.length} ${w.sets.length === 1 ? 'Satz' : 'Sätze'} · ${Math.round(volume(w.sets))} kg Volumen`),
      h('ul', { class: 'sets' }, [...groups].map(([ex, ss]) => h('li', {}, h('span', {}, ex), h('span', { class: 'mute' }, ss.map(s => `${fmtKg(s.kg)}×${s.reps}`).join(', '))))));
  })];
}

function viewFortschritt() {
  if (!S.workouts.length) return [h('h2', {}, 'Fortschritt'), h('p', { class: 'empty' }, 'Nach dem ersten gespeicherten Training siehst du hier deine Entwicklung.')];
  const names = new Map();
  S.workouts.forEach(w => w.sets.forEach(s => { if (!names.has(norm(s.ex))) names.set(norm(s.ex), s.ex); }));
  const keys = [...names.keys()].sort();
  if (!chartEx || !names.has(chartEx)) chartEx = keys[0];

  const sel = h('select', { 'aria-label': 'Übung', onchange: e => { chartEx = e.target.value; render(); } },
    keys.map(k => h('option', { value: k, selected: k === chartEx }, names.get(k))));
  const met = h('select', { 'aria-label': 'Wert', onchange: e => { chartMetric = e.target.value; render(); } },
    h('option', { value: 'kg', selected: chartMetric === 'kg' }, 'Max-Gewicht'),
    h('option', { value: 'e1rm', selected: chartMetric === 'e1rm' }, 'Geschätztes 1RM'));

  const pts = [...S.workouts].reverse().map(w => {
    const m = w.sets.filter(s => norm(s.ex) === chartEx);
    if (!m.length) return null;
    return { label: fmtShort(w.start), value: chartMetric === 'kg' ? Math.max(...m.map(s => s.kg)) : Math.max(...m.map(s => e1rm(s.kg, s.reps))) };
  }).filter(Boolean);

  const bars = [];
  const base = new Date(weekStart(Date.now()));
  for (let i = 7; i >= 0; i--) {
    const d = new Date(base); d.setDate(d.getDate() - 7 * i);
    const k = d.getTime();
    bars.push({ label: fmtShort(k), value: volume(S.workouts.filter(w => weekStart(w.start) === k).flatMap(w => w.sets)) });
  }

  const prs = keys.map(k => {
    const ss = S.workouts.flatMap(w => w.sets).filter(s => norm(s.ex) === k);
    const top = ss.reduce((b, s) => (s.kg > b.kg || (s.kg === b.kg && s.reps > b.reps)) ? s : b);
    return { name: names.get(k), s: top };
  });

  const totalVol = volume(S.workouts.flatMap(w => w.sets));
  return [
    h('div', { class: 'stats' },
      h('div', { class: 'card' }, h('div', { class: 'big' }, S.workouts.length), h('div', { class: 'mute' }, 'Trainings')),
      h('div', { class: 'card' }, h('div', { class: 'big' }, streak()), h('div', { class: 'mute' }, 'Wochen-Serie')),
      h('div', { class: 'card' }, h('div', { class: 'big' }, `${weekCount()}/${S.settings.goal}`), h('div', { class: 'mute' }, 'Diese Woche')),
      h('div', { class: 'card' }, h('div', { class: 'big' }, `${fmtKg(Math.round(totalVol / 100) / 10)} t`), h('div', { class: 'mute' }, 'Gesamtvolumen'))),
    h('h2', {}, 'Entwicklung'),
    h('section', { class: 'card' }, sel, met, lineChart(pts, 'kg')),
    h('h2', {}, 'Volumen pro Woche'),
    h('section', { class: 'card' }, barChart(bars)),
    h('h2', {}, 'Persönliche Rekorde'),
    h('section', { class: 'card' }, h('ul', { class: 'sets', style: 'margin:0' }, prs.map(p => h('li', {},
      h('span', {}, p.name), h('span', { class: 'mute' }, `${fmtKg(p.s.kg)} kg × ${p.s.reps}`)))))
  ];
}

/* ---------- app shell ---------- */
const $main = document.getElementById('main');
function render() {
  const views = { heute: viewHeute, plaene: viewPlaene, verlauf: viewVerlauf, fortschritt: viewFortschritt };
  $main.replaceChildren(...[].concat(views[tab]()));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  document.getElementById('live').hidden = !S.active;
  if (S.active) tick();
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));

render();
if (S.active) { startTicker(); wake(); }

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
