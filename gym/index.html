<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Jarvis Gym</title>
<style>
@font-face{font-family:"Saira Condensed";font-weight:700;font-display:swap;src:url(fonts/saira-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Saira Condensed";font-weight:800;font-display:swap;src:url(fonts/saira-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:700;font-display:swap;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2")}

/* Layout: one-column cockpit. Reactor hero, stacked armor-plate cards, sticky workout HUD, frosted dock. */
:root{
  color-scheme:dark;
  --bg:#0b0a0d;
  --surface:#131116;
  --surface-2:#1a171e;
  --line:rgba(255,236,224,.07);
  --line-2:rgba(255,236,224,.13);
  --text:#f4efe9;
  --mute:#958c97;
  --dim:#6b636e;
  --red:#e5383b;
  --red-hi:#ff5a5d;
  --red-deep:#a3191e;
  --gold:#f2b33d;
  --gold-hi:#ffd27a;
  --cyan:#5fdcff;
  --green:#39d98a;
  --ink:#16090a;
  --f-display:"Saira Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  margin:0;min-height:100%;color:var(--text);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(520px 380px at -10% -4%,rgba(229,56,59,.22),transparent 70%),
    radial-gradient(420px 300px at 110% 2%,rgba(242,179,61,.09),transparent 70%),
    var(--bg);
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 6px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 3px rgba(95,220,255,.15),0 0 14px var(--cyan)}
.brand .k{font:700 11px/1 var(--f-mono);letter-spacing:.32em;color:var(--mute)}
.brand .n{font:800 28px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;background:linear-gradient(180deg,#fff,#e9d6c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.tr{display:flex;align-items:center;gap:10px}
.date{font:500 11px/1 var(--f-mono);color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:6px;font:700 10px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--green);padding:6px 9px;border-radius:999px;background:rgba(57,217,138,.1);border:1px solid rgba(57,217,138,.3)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

/* section heads */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 2px 12px}
.sec h2{margin:0;font:700 12px/1 var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.sec span{font:500 12px/1 var(--f-mono);color:var(--dim)}

/* surfaces */
.panel{position:relative;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 22px 44px -28px rgba(0,0,0,.9)}
.stack{display:grid;gap:12px}

/* hero reactor */
.hero{display:grid;gap:18px;padding:18px 16px 16px;overflow:hidden;margin-top:10px}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(260px 200px at 50% 30%,rgba(95,220,255,.10),transparent 70%)}
.reactor{display:grid;place-items:center;position:relative;z-index:1}
.reactor svg{width:min(60vw,220px);height:auto;overflow:visible}
.tick{stroke:rgba(255,236,224,.14)}
.tick.on{stroke:var(--cyan)}
.arc-track{stroke:rgba(255,255,255,.055)}
.arc{stroke:var(--cyan);filter:drop-shadow(0 0 6px rgba(95,220,255,.7))}
.arc.full{stroke:var(--green);filter:drop-shadow(0 0 6px rgba(57,217,138,.7))}
.core{fill:rgba(95,220,255,.05);stroke:rgba(95,220,255,.35)}
.inner{stroke:rgba(95,220,255,.45);transform-box:fill-box;transform-origin:center}
.r-num{font:800 58px/1 var(--f-display);fill:var(--text)}
.r-of{font-size:26px;fill:var(--mute)}
.r-lbl{font:700 8.5px/1 var(--f-mono);letter-spacing:.26em;fill:var(--mute)}
@media (prefers-reduced-motion:no-preference){.inner{animation:spin 48s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}

/* chase-cam hero video */
.cam{position:relative;z-index:1;width:100%;aspect-ratio:1/1;max-height:440px;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line-2)}
.cam-feed{position:absolute;inset:-7%}
.cam-slot{position:absolute;inset:0}
.cam-feed iframe{position:absolute;top:0;left:50%;height:100%;width:177.78%;transform:translateX(-50%);border:0;pointer-events:none}
.cam-hud{position:absolute;inset:0;pointer-events:none;font:700 10px/1 var(--f-mono);letter-spacing:.16em;color:#fff;text-shadow:0 1px 3px #000;text-transform:uppercase}
.cam-hud::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.6))}
.cam-hud::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
.cc{position:absolute;width:22px;height:22px;border:2px solid rgba(255,255,255,.85)}
.cc.tl{top:12px;left:12px;border-right:0;border-bottom:0}.cc.tr{top:12px;right:12px;border-left:0;border-bottom:0}
.cc.bl{bottom:12px;left:12px;border-right:0;border-top:0}.cc.br{bottom:12px;right:12px;border-left:0;border-top:0}
.rec{position:absolute;top:18px;left:42px;display:flex;align-items:center;gap:6px;z-index:1}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--red-hi);box-shadow:0 0 8px var(--red-hi)}
.camid{position:absolute;top:32px;left:42px;font-weight:500;color:rgba(255,255,255,.72);z-index:1}
.tc{position:absolute;top:18px;right:42px;z-index:1;font-variant-numeric:tabular-nums}
.reticle{position:absolute;left:50%;top:46%;width:96px;height:96px;margin:-48px;z-index:1}
.reticle svg{width:100%;height:100%;overflow:visible}
.lock{position:absolute;left:0;right:0;top:calc(46% + 56px);text-align:center;color:var(--gold-hi);font-size:9px;z-index:1}
.cam-tag{position:absolute;left:42px;bottom:22px;z-index:1;display:grid;gap:5px}
.cam-tag b{font:800 22px/1 var(--f-display);letter-spacing:.02em}
.cam-tag span{color:rgba(255,255,255,.72);font-weight:500}
.cam-ring{position:absolute;right:42px;bottom:22px;width:66px;height:66px;z-index:1}
.cam-ring svg{width:100%;height:100%}
.cam-ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 18px/1 var(--f-display);letter-spacing:0}
@media (prefers-reduced-motion:no-preference){
  .cam-feed{animation:handheld 7s ease-in-out infinite alternate}
  .reticle{animation:track 9s ease-in-out infinite alternate}
  .rec i{animation:recblink 1.2s steps(2,jump-none) infinite}
}
@keyframes handheld{0%{transform:translate(0,0) rotate(0) scale(1.02)}25%{transform:translate(-1.4%,.9%) rotate(-.45deg) scale(1.05)}50%{transform:translate(1.1%,-.7%) rotate(.35deg) scale(1.08)}75%{transform:translate(-.7%,-1.1%) rotate(-.25deg) scale(1.06)}100%{transform:translate(.9%,.8%) rotate(.4deg) scale(1.11)}}
@keyframes track{0%{transform:translate(-16px,8px)}30%{transform:translate(12px,-10px)}60%{transform:translate(-6px,14px)}100%{transform:translate(14px,4px)}}
@keyframes recblink{50%{opacity:.15}}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;position:relative;z-index:1}
.day{display:grid;justify-items:center;gap:7px;font:700 10px/1 var(--f-mono);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.day b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--f-display);color:var(--mute);border:1px solid var(--line-2);background:rgba(255,255,255,.02)}
.day.done b{color:#fff;border-color:transparent;background:radial-gradient(circle at 35% 30%,var(--red-hi),var(--red) 55%,var(--red-deep));box-shadow:0 0 16px rgba(229,56,59,.55)}
.day.today{color:var(--gold)}
.day.today b{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,179,61,.12)}
.day.today.done b{border:2px solid var(--gold)}

.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.mini{padding:12px 10px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);min-width:0}
.mini .v{font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini .l{font:700 9px/1.25 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:7px}
.t-gold{color:var(--gold)}.t-cyan{color:var(--cyan)}.t-red{color:var(--red-hi)}.t-green{color:var(--green)}

/* plan cards */
.plan{--tone:var(--red);position:relative;display:grid;gap:10px;width:100%;text-align:left;padding:18px 16px 16px;border-radius:var(--r);border:1px solid var(--line);cursor:pointer;overflow:hidden;
  background:radial-gradient(150% 120% at 100% 0%,color-mix(in srgb,var(--tone) 24%,transparent),transparent 55%),linear-gradient(180deg,var(--surface-2),var(--surface));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 22px 44px -28px rgba(0,0,0,.9)}
.plan:active{transform:scale(.99)}
.plan::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:1px solid color-mix(in srgb,var(--tone) 30%,transparent);pointer-events:none}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.plan h3{margin:0;font:800 34px/.95 var(--f-display);text-transform:uppercase;letter-spacing:.015em}
.go{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tone);color:var(--ink);box-shadow:0 8px 22px -8px var(--tone)}
.p-ex{color:var(--mute);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 11px/1 var(--f-mono);color:var(--mute);letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;padding:6px 9px;border-radius:999px;color:var(--tone,var(--mute));background:color-mix(in srgb,var(--tone,#888) 14%,transparent);border:1px solid color-mix(in srgb,var(--tone,#888) 38%,transparent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:0 18px;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);font:700 14px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .08s,background .15s}
.btn:active{transform:scale(.985)}
.btn.primary{border-color:transparent;color:#fff;background:linear-gradient(180deg,var(--red-hi),var(--red) 45%,#c42528);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 28px -14px rgba(229,56,59,.95)}
.btn.ghost{border-style:dashed;color:var(--mute);background:transparent}
.btn.danger{color:var(--red-hi);border-color:rgba(229,56,59,.4);background:rgba(229,56,59,.07)}
.btn.sm{width:auto;min-height:40px;padding:0 13px;font-size:12px;border-radius:11px;gap:6px}
.btn.icon{width:38px;min-height:38px;padding:0;border-radius:11px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--dim)}
.row{display:flex;gap:8px}.row>.btn{flex:1}

/* workout HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin:6px -16px 0;padding:10px 16px 12px;background:linear-gradient(180deg,rgba(11,10,13,.97),rgba(11,10,13,.88));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hud-in{display:flex;align-items:center;gap:14px}
.kick{font:700 10px/1 var(--f-mono);letter-spacing:.22em;color:var(--red-hi);text-transform:uppercase}
.clock{font:800 44px/1 var(--f-display);color:var(--cyan);font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(95,220,255,.35);margin-top:4px}
.hstats{display:flex;gap:14px;margin-left:auto;text-align:right}
.hstats b{display:block;font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hstats span{font:700 9px/1 var(--f-mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.rest{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px 12px 14px;border-radius:14px;border:1px solid rgba(242,179,61,.38);background:linear-gradient(90deg,rgba(242,179,61,.13),rgba(242,179,61,.04))}
.rest .l{font:700 9px/1 var(--f-mono);letter-spacing:.22em;color:var(--gold);text-transform:uppercase;opacity:.85}
.rest .t{font:800 34px/1 var(--f-display);color:var(--gold);font-variant-numeric:tabular-nums;margin-top:3px}
.rest .acts{display:flex;gap:6px;margin-left:auto}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));box-shadow:0 0 10px var(--gold);transition:width .5s linear}
.rest.done{border-color:rgba(57,217,138,.45);background:linear-gradient(90deg,rgba(57,217,138,.14),rgba(57,217,138,.04))}
.rest.done .t,.rest.done .l{color:var(--green)}
.rest.done .bar{width:100%!important;background:var(--green);box-shadow:0 0 10px var(--green)}

.voice{display:flex;align-items:center;gap:14px;margin:16px 2px 4px}
.mic{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line-2);background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.08),rgba(255,255,255,.02));transition:box-shadow .2s,background .2s}
.mic.on{background:radial-gradient(circle at 40% 30%,var(--red-hi),var(--red));border-color:transparent;box-shadow:0 0 0 7px rgba(229,56,59,.18),0 0 30px rgba(229,56,59,.7)}
.voice b{display:block;font-weight:700;letter-spacing:.02em}
.voice span{color:var(--mute);font-size:14px}

/* exercise card */
.ex{display:grid;gap:14px;scroll-margin-top:210px}
.ex.has{border-color:rgba(229,56,59,.25)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-idx{font:700 10px/1 var(--f-mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.ex h3{margin:6px 0 0;font:800 27px/1 var(--f-display);text-transform:uppercase;letter-spacing:.015em;text-wrap:balance}
.summary{display:grid;gap:12px;border-color:rgba(57,217,138,.35);background:radial-gradient(120% 120% at 100% 0%,rgba(57,217,138,.12),transparent 55%),linear-gradient(180deg,var(--surface-2),var(--surface))}
.summary h3{margin:0;font:800 30px/1 var(--f-display);text-transform:uppercase}
.summary .hint{color:var(--mute);font-size:14px}
.prs{display:flex;flex-wrap:wrap;gap:6px}
.plan.next{border-color:color-mix(in srgb,var(--tone) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--tone) 40%,transparent),0 18px 40px -20px color-mix(in srgb,var(--tone) 70%,transparent)}
.nextchip{display:inline-block;white-space:nowrap;font:700 9.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--tone);padding:5px 8px;border-radius:999px;margin-bottom:8px}
.count{font:700 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red-hi);padding:6px 9px;border-radius:999px;background:rgba(229,56,59,.12);border:1px solid rgba(229,56,59,.3);white-space:nowrap}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{display:inline-flex;gap:6px;align-items:baseline;font:500 11px/1 var(--f-mono);letter-spacing:.04em;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--mute)}
.fact b{color:var(--text);font-weight:700}
.fact.sug{color:var(--gold);border-color:rgba(242,179,61,.38);background:rgba(242,179,61,.08)}
.fact.sug b{color:var(--gold-hi)}
.fact.rec b{color:var(--cyan)}
.setlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:30px 1fr auto auto;align-items:center;gap:10px;padding:7px 6px 7px 8px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.setrow .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 13px/1 var(--f-mono);background:rgba(229,56,59,.14);color:var(--red-hi)}
.setrow .w{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.setrow .w small{font:500 11px/1 var(--f-mono);color:var(--mute);margin:0 6px 0 3px}
.pr{display:inline-flex;align-items:center;gap:4px;font:700 10px/1 var(--f-mono);letter-spacing:.12em;padding:5px 8px;border-radius:999px;color:#2b1a00;background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 0 14px rgba(242,179,61,.5)}
.sets3{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:32px minmax(0,1.15fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.srow.head{font:700 9px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:-2px}
.srow.head span{padding-left:2px}
.srow .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:700 13px/1 var(--f-mono);background:rgba(255,255,255,.05);color:var(--mute);border:1px solid var(--line)}
.cell{display:flex;align-items:center;gap:6px;height:54px;padding:0 12px;border-radius:13px;border:1px solid var(--line-2);background:rgba(0,0,0,.4);cursor:text;transition:border-color .15s,box-shadow .15s,background .15s;min-width:0}
.cell input,.cell b{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:0;margin:0;font:800 26px/1 var(--f-display);color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.cell input::placeholder{color:var(--dim)}
.cell input:focus{outline:none}
.cell span{font:700 9.5px/1 var(--f-mono);letter-spacing:.08em;color:var(--mute);text-transform:uppercase;flex:none}
.cell:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,179,61,.14)}
.chk{width:52px;height:54px;border-radius:13px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line-2);background:rgba(255,255,255,.035);color:var(--dim);transition:transform .08s,background .15s}
.chk:active{transform:scale(.95)}
.chk:disabled{cursor:default;opacity:.5}
.srow.next .n{background:rgba(229,56,59,.14);color:var(--red-hi);border-color:rgba(229,56,59,.35)}

<body>
<div class="wrap">

</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<nav class="dock" aria-label="Navigation">

</nav>
<script>
'use strict';
const LS = 'jarvisGym.v1';
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (v, d = 0) => Number.isFinite(+v) ? +v : d;
const str = (v, d = '') => typeof v === 'string' ? v.slice(0, 80) : d;
const norm = s => s.trim().toLowerCase();

const DEFAULT = {
  plans: [
    { id: 'p1', name: 'Push', exercises: ['Bankdrücken', 'Schulterdrücken', 'Schrägbankdrücken', 'Seitheben', 'Trizepsdrücken'] },
    { id: 'p2', name: 'Pull', exercises: ['Klimmzüge', 'Rudern', 'Latziehen', 'Face Pulls', 'Bizeps-Curls'] },
    { id: 'p3', name: 'Beine', exercises: ['Kniebeugen', 'Beinpresse', 'Rumänisches Kreuzheben', 'Beinbeuger', 'Wadenheben'] }
  ],
  workouts: [],
  active: null,
  settings: { rest: 90, goal: 3, sets: 3, repTarget: 8, step: 2.5, speak: false, heroVideo: null }
};

function cleanSets(a) {
  return (Array.isArray(a) ? a : []).map(s => ({
    ex: str(s && s.ex), kg: Math.max(0, num(s && s.kg)), reps: Math.round(num(s && s.reps)),
    t: num(s && s.t), pr: s && s.pr ? true : undefined
  })).filter(s => s.ex && s.reps >= 1);
}
function cleanDraft(d) {
  const out = {};
  if (!d || typeof d !== 'object') return out;
  for (const [name, v] of Object.entries(d).slice(0, 60)) {
    if (!v || typeof v !== 'object') continue;
    const rows = {};
    for (const [j, r] of Object.entries(v.rows || {}).slice(0, 20)) {
      if (r && typeof r === 'object' && /^\d+$/.test(j)) rows[j] = { kg: str(r.kg).slice(0, 8), reps: str(r.reps).slice(0, 4) };
    }
    out[str(name)] = { n: clamp(Math.round(num(v.n, 0)), 0, 20), rows };
  }
  return out;
}
function cleanNames(a) { return (Array.isArray(a) ? a : []).map(x => str(x).trim()).filter(Boolean); }

function sanitize(o) {
  o = o && typeof o === 'object' ? o : {};
  const st = clone(DEFAULT);
  if (Array.isArray(o.plans)) {
    st.plans = o.plans.map(p => ({ id: str(p && p.id) || uid(), name: str(p && p.name, 'Plan'), exercises: cleanNames(p && p.exercises) }));
  }
  st.workouts = (Array.isArray(o.workouts) ? o.workouts : []).map(w => ({
    id: str(w && w.id) || uid(), start: num(w && w.start), end: num(w && w.end),
    plan: str(w && w.plan, 'Training'), sets: cleanSets(w && w.sets)
  })).filter(w => w.sets.length && w.start);
  const a = o.active;
  if (a && typeof a === 'object' && num(a.start)) {
    st.active = {
      id: str(a.id) || uid(), start: num(a.start), plan: str(a.plan, 'Training'),
      exercises: cleanNames(a.exercises), sets: cleanSets(a.sets), draft: cleanDraft(a.draft),
      restEnd: num(a.restEnd) || null, restLen: num(a.restLen) || 90000
    };
  }
  const s = o.settings || {};
  st.settings = {
    rest: clamp(num(s.rest, 90), 10, 600), goal: clamp(Math.round(num(s.goal, 3)), 1, 14), sets: clamp(Math.round(num(s.sets, 3)), 1, 10),
    repTarget: clamp(Math.round(num(s.repTarget, 8)), 1, 30), step: clamp(num(s.step, 2.5), 0.25, 25), speak: !!s.speak,
    heroVideo: s.heroVideo && /^[A-Za-z0-9_-]{11}$/.test(s.heroVideo.id) ? { id: s.heroVideo.id, start: clamp(Math.round(num(s.heroVideo.start, 0)), 0, 86400), trim: clamp(Math.round(num(s.heroVideo.trim, 0)), 0, 600) } : null
  };
  return st;
}

let S;
try { S = sanitize(JSON.parse(localStorage.getItem(LS))); } catch { S = sanitize(null); }
let saveT;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 400); }
function save() {
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch { toast('Speichern fehlgeschlagen – Speicher voll oder gesperrt'); }
}

/* ---------- DOM helpers ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in props || {}) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  for (const c of kids) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const I = {
  arrow: 'M5 12h14M13 6l6 6-6 6',
  plus: 'M12 5v14M5 12h14',
  minus: 'M5 12h14',
  check: 'M5 12.5l4.5 4.5L19 7.5',
  x: 'M6.5 6.5l11 11M17.5 6.5l-11 11',
  mic: 'M12 3.5a3 3 0 0 0-3 3v5.5a3 3 0 0 0 6 0V6.5a3 3 0 0 0-3-3zM5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5',
  trophy: 'M8 4h8v5.5a4 4 0 0 1-8 0V4zM8 6H5.5a2.5 2.5 0 0 0 2.6 4M16 6h2.5a2.5 2.5 0 0 1-2.6 4M12 13.5V17M8.5 20h7',
  chart: 'M3.5 17l5.5-5.5 4 4 7.5-7.5M15 8h5.5v5.5',
  clock: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM12 7.5V12l3 2'
};
const icon = (d, s = 20) => sv('svg', { width: s, height: s, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' }, sv('path', { d }));

let toastT;
function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = kind || ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800);
}

/* ---------- formatting & stats ---------- */
const fmtKg = n => String(Math.round(n * 100) / 100).replace('.', ',');
const parseNum = v => parseFloat(String(v).replace(',', '.'));
const setLabel = s => s.kg > 0 ? `${fmtKg(s.kg)}×${s.reps}` : `${s.reps} Wdh.`;
const setsLabel = ss => {
  if (ss.every(s => s.kg === ss[0].kg)) return ss[0].kg > 0 ? `${fmtKg(ss[0].kg)} kg · ${ss.map(s => s.reps).join('/')}` : `${ss.map(s => s.reps).join('/')} Wdh.`;
  return ss.map(setLabel).join(' · ');
};
const fmtTons = kg => kg < 1000 ? `${Math.round(kg)} kg` : `${fmtKg(Math.round(kg / 100) / 10)} t`;
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return hh ? `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${mm}:${String(ss).padStart(2, '0')}`;
}
const fmtShort = ts => new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
const e1rm = (kg, reps) => kg * (1 + reps / 30);
const volume = sets => sets.reduce((a, s) => a + s.kg * s.reps, 0);
const midnight = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
function daysAgo(ts) {
  const n = Math.round((midnight(Date.now()) - midnight(ts)) / 864e5);
  return n <= 0 ? 'heute' : n === 1 ? 'gestern' : `vor ${n} Tagen`;
}
function isoWeek(ts) {
  const d = new Date(midnight(ts));
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7);
}
function weekStart(ts) {
  const d = new Date(midnight(ts));
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return d.getTime();
}
const thisWeek = () => S.workouts.filter(w => weekStart(w.start) === weekStart(Date.now()));
const weekCount = () => thisWeek().length;
function streak() {
  const counts = new Map();
  S.workouts.forEach(w => { const k = weekStart(w.start); counts.set(k, (counts.get(k) || 0) + 1); });
  const d = new Date(weekStart(Date.now()));
  let n = 0;
  if ((counts.get(d.getTime()) || 0) < S.settings.goal) d.setDate(d.getDate() - 7);
  while ((counts.get(d.getTime()) || 0) >= S.settings.goal) { n++; d.setDate(d.getDate() - 7); }
  return n;
}
function weekDays() {
  const start = new Date(weekStart(Date.now())), today = midnight(Date.now());
  const trained = new Set(S.workouts.map(w => midnight(w.start)));
  return ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((short, i) => {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const t = d.getTime();
    return { short, num: d.getDate(), long: d.toLocaleDateString('de-DE', { weekday: 'long' }), done: trained.has(t), today: t === today };
  });
}
function allSets(ex) {

function nextPlan() {

function exCard(name, i) {
  const a = S.active, last = lastSets(name), sug = suggest(name);
  const dr = a.draft[name] || (a.draft[name] = { n: 0, rows: {} });
  const mine = a.sets.filter(s => s.ex === name);
  const total = Math.max(dr.n || Math.round(S.settings.sets), mine.length);
  const best = Math.max(0, ...allSets(name).map(s => s.kg));
  const vals = s => ({ kg: s.kg > 0 ? fmtKg(s.kg) : '', reps: String(s.reps) });
  const base = sug ? vals(sug) : last[0] ? vals(last[0]) : { kg: '', reps: '' };
  const valAt = j => j < mine.length ? vals(mine[j]) : dr.rows[j] || (j === 0 ? base : valAt(j - 1));
  const pend = [];
  const rows = [h('div', { class: 'srow head', 'aria-hidden': 'true' }, h('span', {}, 'Satz'), h('span', {}, 'Gewicht'), h('span', {}, 'Wdh.'), h('span', {}))];
  for (let j = 0; j < total; j++) {
    if (j < mine.length) {
      const s = mine[j];
      rows.push(h('div', { class: 'srow done' },
        h('span', { class: 'n' + (s.pr ? ' prn' : ''), title: s.pr ? 'Neuer Rekord' : null }, s.pr ? icon(I.trophy, 15) : j + 1),
        h('div', { class: 'cell' }, h('b', {}, s.kg > 0 ? fmtKg(s.kg) : '–'), h('span', {}, 'kg')),
        h('div', { class: 'cell' }, h('b', {}, s.reps), h('span', {}, 'Wdh.')),
        h('button', { class: 'chk', 'aria-label': `Satz ${j + 1} rückgängig machen`, onclick: () => { if (confirm(`Satz ${j + 1} von ${name} rückgängig machen?`)) removeSet(s); } }, icon(I.check, 22))));
      continue;
    }
    const v = valAt(j), isNext = j === mine.length;
    const kgIn = h('input', { type: 'text', id: `kg-${i}-${j}`, inputmode: 'decimal', autocomplete: 'off', placeholder: '0', value: v.kg, 'aria-label': `Satz ${j + 1}: Gewicht in kg` });
    const repsIn = h('input', { type: 'text', id: `reps-${i}-${j}`, inputmode: 'numeric', pattern: '[0-9]*', autocomplete: 'off', placeholder: '0', value: v.reps, 'aria-label': `Satz ${j + 1}: Wiederholungen` });
    pend.push({ j, kgIn, repsIn });
    const onEdit = () => {
      dr.rows[j] = { kg: kgIn.value, reps: repsIn.value }; focusEx = i; saveSoon();
      pend.forEach(q => { if (q.j > j && !dr.rows[q.j]) { q.kgIn.value = kgIn.value; q.repsIn.value = repsIn.value; } });
    };
    kgIn.addEventListener('input', onEdit);
    repsIn.addEventListener('input', onEdit);
    rows.push(h('div', { class: 'srow ' + (isNext ? 'next' : 'later') },
      h('span', { class: 'n' }, j + 1),
      h('label', { class: 'cell' }, kgIn, h('span', {}, 'kg')),
      h('label', { class: 'cell' }, repsIn, h('span', {}, 'Wdh.')),
      h('button', { class: 'chk', disabled: !isNext, 'aria-label': `Satz ${j + 1} abhaken`, onclick: () => { focusEx = i; addSet(name, parseNum(kgIn.value.trim() || '0'), parseNum(repsIn.value)); } }, icon(I.check, 22))));
  }
  const doneAll = mine.length >= total;
  return h('section', { class: 'panel ex' + (doneAll ? ' complete' : mine.length ? ' has' : '') },
    h('div', { class: 'ex-head' },
      h('div', {}, h('div', { class: 'ex-idx' }, `Übung ${i + 1} / ${a.exercises.length}`), h('h3', {}, name)),
      mine.length
        ? h('span', { class: 'count' + (doneAll ? ' ok' : '') }, doneAll ? 'Fertig' : `${mine.length} / ${total} Sätze`)
        : h('button', { class: 'btn sm icon quiet', 'aria-label': `${name} entfernen`, onclick: () => { a.exercises.splice(i, 1); save(); render(); } }, icon(I.x, 16))),
    h('div', { class: 'facts' },
      last.length ? fact('Zuletzt', setsLabel(last)) : h('span', { class: 'fact' }, 'Erstes Mal'),
      sug && fact('Ziel', sug.kg > 0 ? `${fmtKg(sug.kg)} kg × ${sug.reps}` : `${sug.reps} Wdh.`, 'sug'),
      best > 0 && fact('Rekord', `${fmtKg(best)} kg`, 'rec')),
    h('div', { class: 'sets3' }, rows),
    h('div', { class: 'setbtns' },
      h('button', { class: 'btn sm ghost', onclick: () => { dr.n = total + 1; save(); render(); } }, icon(I.plus, 16), 'Satz'),
      total > Math.max(1, mine.length) && h('button', { class: 'btn sm ghost', onclick: () => { dr.n = total - 1; save(); render(); } }, icon(I.minus, 16), 'Satz')));
}

function backupCard() {

      h('button', { class: 'btn sm', onclick: () => file.click() }, 'Importieren')),

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });

  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);

function viewFortschritt() {
  const out = [sec('Fortschritt', `KW ${isoWeek(Date.now())}`)];
  if (!S.workouts.length) return out.concat(emptyState(I.chart, 'Noch keine Daten', 'Nach dem ersten gespeicherten Training siehst du hier deine Entwicklung.'));
  const names = new Map();
  S.workouts.forEach(w => w.sets.forEach(s => { if (!names.has(norm(s.ex))) names.set(norm(s.ex), s.ex); }));
  const keys = [...names.keys()].sort();
  if (!chartEx || !names.has(chartEx)) chartEx = keys[0];
  const allDone = S.workouts.flatMap(w => w.sets);

  out.push(h('div', { class: 'tiles' },
    h('div', { class: 'panel tile' }, h('div', { class: 'l t-red' }, h('span', {}, 'Trainings')), h('div', { class: 'v' }, S.workouts.length)),
    h('div', { class: 'panel tile' }, h('div', { class: 'l t-gold' }, h('span', {}, 'Serie')), h('div', { class: 'v' }, streak(), h('small', {}, 'Wo.'))),
    h('div', { class: 'panel tile' }, h('div', { class: 'l t-cyan' }, h('span', {}, 'Diese Woche')), h('div', { class: 'v' }, weekCount(), h('small', {}, `/ ${S.settings.goal}`))),
    h('div', { class: 'panel tile' }, h('div', { class: 'l t-green' }, h('span', {}, 'Gesamtvolumen')), h('div', { class: 'v' }, fmtTons(volume(allDone))))));

  const bw = allDone.filter(s => norm(s.ex) === chartEx).every(s => s.kg === 0);
  const unit = bw ? 'Wdh.' : 'kg';
  const pts = [...S.workouts].reverse().map(w => {
    const m = w.sets.filter(s => norm(s.ex) === chartEx);
    if (!m.length) return null;
    const value = bw ? Math.max(...m.map(s => s.reps)) : chartMetric === 'kg' ? Math.max(...m.map(s => s.kg)) : Math.round(Math.max(...m.map(s => e1rm(s.kg, s.reps))) * 10) / 10;
    return { label: fmtShort(w.start), value };
  }).filter(Boolean);
  const first = pts[0].value, lastV = pts[pts.length - 1].value, diff = Math.round((lastV - first) * 10) / 10;
  const sel = h('select', { id: 'chart-ex', 'aria-label': 'Übung', onchange: e => { chartEx = e.target.value; render(); } },
    keys.map(k => h('option', { value: k, selected: k === chartEx }, names.get(k))));
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Wert' },
    [['kg', 'Max-Gewicht'], ['e1rm', 'Geschätztes 1RM']].map(([v, l]) => h('button', { 'aria-pressed': String(chartMetric === v), onclick: () => { chartMetric = v; render(); } }, l)));
  out.push(sec('Entwicklung', `${pts.length} ${pts.length === 1 ? 'Einheit' : 'Einheiten'}`),
    h('section', { class: 'panel' },
      h('div', { class: 'stack', style: 'gap:8px' }, sel, !bw && seg),
      h('div', { class: 'headline' }, h('b', {}, fmtKg(lastV)), h('small', {}, unit),
        pts.length > 1 && h('span', { class: 'delta ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat') }, `${diff > 0 ? '+' : ''}${fmtKg(diff)} ${unit} seit ${pts[0].label}`)),
      lineChart(pts, unit)));

  const bars = [];
  const base = new Date(weekStart(Date.now()));
  for (let i = 7; i >= 0; i--) {
    const d = new Date(base); d.setDate(d.getDate() - 7 * i);
    const k = d.getTime();
    bars.push({ label: `KW${isoWeek(k)}`, value: volume(S.workouts.filter(w => weekStart(w.start) === k).flatMap(w => w.sets)) });
  }
  out.push(sec('Volumen pro Woche', 'in Tonnen'), h('section', { class: 'panel' }, barChart(bars)));

  const prs = keys.map(k => {
    const ss = allDone.filter(s => norm(s.ex) === k);
    const top = ss.reduce((b, s) => (s.kg > b.kg || (s.kg === b.kg && s.reps > b.reps)) ? s : b);
    return { name: names.get(k), s: top };
  }).sort((x, y) => y.s.kg - x.s.kg);
  out.push(sec('Persönliche Rekorde', `${prs.length}`),
    h('section', { class: 'panel' }, h('ul', { class: 'prlist' }, prs.map(p => h('li', {},
      h('span', { class: 'medal' }, icon(I.trophy, 18)),
      h('div', { style: 'min-width:0' }, h('b', {}, p.name), h('span', {}, p.s.kg > 0 ? `≈ ${fmtKg(Math.round(e1rm(p.s.kg, p.s.reps)))} kg 1RM` : 'Körpergewicht')),
      p.s.kg > 0 ? h('div', { class: 'prv' }, fmtKg(p.s.kg), h('small', {}, `kg × ${p.s.reps}`)) : h('div', { class: 'prv' }, p.s.reps, h('small', {}, 'Wdh.')))))));
  return out;
}

const $main = document.getElementById('main');
function render() {
  if (tab !== 'heute' || S.active) stopHero();
  const views = { heute: viewHeute, plaene: viewPlaene, verlauf: viewVerlauf, fortschritt: viewFortschritt };
  $main.replaceChildren(...[].concat(views[tab]()).filter(Boolean));
  document.querySelectorAll('.dock button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  document.getElementById('live').hidden = !S.active;
  const now = Date.now();
  document.getElementById('today').textContent = `${new Date(now).toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '')} ${fmtShort(now)} · KW ${isoWeek(now)}`;
  if (S.active) tick();
}
document.querySelectorAll('.dock button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));

render();
if (S.active) { startTicker(); wake(); }

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
